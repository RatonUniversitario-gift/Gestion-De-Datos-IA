name: Ingesta diaria - ChileCompra

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:       

jobs:
  ingestar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ingesta
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
        run: python scripts/ingestion.py
      

      - name: Ejecutar limpieza
        run: python scripts/limpieza.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/
          git diff --staged --quiet || git commit -m "data: ingesta automática $(date +'%Y-%m-%d')"
          git push